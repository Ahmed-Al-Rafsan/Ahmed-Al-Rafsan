<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How I approach the work</title>
  <desc id="d">Four steps. 1: Define the decision — the question, the audience and what each metric means. 2: Examine the data with PCUVCOD — profile, completeness, uniqueness, validity, consistency, outliers, document. 3: Explain the reasoning — methods, assumptions and limitations shown with results. 4: Make the handover useful — code, docs and dashboards someone can act on.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 17;stroke-linecap:round;animation:flow 1.8s linear infinite}
    .flow.slow{animation-duration:2.6s}
    @keyframes flow{to{stroke-dashoffset:-36}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset=".6" stop-color="#0f2250"/><stop offset="1" stop-color="#173c8b"/>
    </linearGradient>
    <linearGradient id="fadea" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="maska"><rect width="100%" height="100%" fill="url(#fadea)"/></mask>
    <clipPath id="clipa"><rect width="100%" height="100%" rx="20"/></clipPath>
    <linearGradient id="rulea" x1="0" x2="1"><stop offset="0" stop-color="#2858ef"/><stop offset=".7" stop-color="#5b8cff"/><stop offset="1" stop-color="#7fdcc6"/></linearGradient>
    <pattern id="gam" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#a9c4ff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="gaM" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gam)"/>
      <path d="M100 0H0V100" fill="none" stroke="#a9c4ff" stroke-opacity=".11"/>
    </pattern></defs>
  <rect width="1200" height="300" rx="20" fill="url(#bga)"/>
  <rect width="1200" height="300" rx="20" fill="url(#gaM)" mask="url(#maska)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#rulea)" clip-path="url(#clipa)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="#a9c4ff" stroke-opacity=".14"/>
  <text x="48" y="60" class="mono" font-size="13.5" letter-spacing="2" fill="#5b8cff">FIG. 06  —  HOW I APPROACH THE WORK</text>
  <path d="M66 122H912" stroke="#a9c4ff" stroke-opacity=".25" stroke-width="2"/>
  <path class="flow" d="M66 122H912" stroke="#7fdcc6" stroke-width="4.5" fill="none"/>
  <circle cx="66" cy="122" r="18" fill="#7fdcc6" fill-opacity="0.95"/><text x="66" y="127.5" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0a1630">1</text><text x="48" y="176" class="sans" font-size="19" font-weight="700" fill="#f2f6ff">Define the decision</text><text x="48" y="202" class="sans" font-size="15" fill="#b6c5e4">Question, audience, and what</text><text x="48" y="222" class="sans" font-size="15" fill="#b6c5e4">each metric actually means.</text><circle cx="348" cy="122" r="18" fill="#2858ef" fill-opacity="1"/><text x="348" y="127.5" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#fff">2</text><text x="330" y="176" class="sans" font-size="19" font-weight="700" fill="#f2f6ff">Examine the data</text><text x="330" y="202" class="sans" font-size="15" fill="#b6c5e4">Seven checks, same order,</text><text x="330" y="222" class="sans" font-size="15" fill="#b6c5e4">every dataset:</text><circle cx="630" cy="122" r="18" fill="#2858ef" fill-opacity="1"/><text x="630" y="127.5" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#fff">3</text><text x="612" y="176" class="sans" font-size="19" font-weight="700" fill="#f2f6ff">Explain the reasoning</text><text x="612" y="202" class="sans" font-size="15" fill="#b6c5e4">Methods, assumptions and</text><text x="612" y="222" class="sans" font-size="15" fill="#b6c5e4">limitations shown with results.</text><circle cx="912" cy="122" r="18" fill="#2858ef" fill-opacity="1"/><text x="912" y="127.5" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#fff">4</text><text x="894" y="176" class="sans" font-size="19" font-weight="700" fill="#f2f6ff">Make the handover useful</text><text x="894" y="202" class="sans" font-size="15" fill="#b6c5e4">Code, docs and dashboards</text><text x="894" y="222" class="sans" font-size="15" fill="#b6c5e4">someone can act on.</text>
  <rect x="330" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Profile</title></rect><text x="342.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">P</text><rect x="360" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Completeness</title></rect><text x="372.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">C</text><rect x="390" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Uniqueness</title></rect><text x="402.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">U</text><rect x="420" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Validity</title></rect><text x="432.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">V</text><rect x="450" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Consistency</title></rect><text x="462.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">C</text><rect x="480" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Outliers</title></rect><text x="492.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">O</text><rect x="510" y="236" width="25" height="25" rx="6" fill="#5b8cff" fill-opacity=".16" stroke="#5b8cff" stroke-opacity=".5"><title>Document</title></rect><text x="522.5" y="253" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#a9c4ff">D</text>
  <text x="548" y="253" class="mono" font-size="12.5" fill="#7a8fb8">my data-cleaning framework</text>
</svg>
