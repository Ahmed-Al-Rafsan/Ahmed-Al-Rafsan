    <text x="704" y="72" class="mono" font-size="12.5" letter-spacing="1.4" fill="#7a8fb8">FIG. 02 — FROM MARKET TO SHORTLIST</text><text x="704" y="118" class="sans" font-size="20" font-weight="700" fill="#f2f6ff">9,855<tspan class="sans" font-size="14" font-weight="400" fill="#b6c5e4">  schools in the national dataset</tspan></text><rect class="grow" style="animation-delay:0.2s" x="704" y="130" width="400.0" height="22" rx="5" fill="#a9c4ff" fill-opacity=".55"/><text x="704" y="200" class="sans" font-size="20" font-weight="700" fill="#f2f6ff">3,344<tspan class="sans" font-size="14" font-weight="400" fill="#b6c5e4">  met the high-priority threshold</tspan></text><rect class="grow" style="animation-delay:0.4s" x="704" y="212" width="135.7" height="22" rx="5" fill="#5b8cff" fill-opacity=".95"/><text x="704" y="282" class="sans" font-size="20" font-weight="700" fill="#f2f6ff">200<tspan class="sans" font-size="14" font-weight="400" fill="#b6c5e4">  prioritised for CRM outreach</tspan></text><rect class="grow" style="animation-delay:0.6s" x="704" y="294" width="8.1" height="22" rx="5" fill="#7fdcc6" fill-opacity="1"/><path d="M704 356V368M1104 356V368M704 362H1104" stroke="#a9c4ff" stroke-opacity=".45"/><text x="704" y="388" class="mono" font-size="12" fill="#7a8fb8">0</text><text x="1104" y="388" text-anchor="end" class="mono" font-size="12" fill="#7a8fb8">9,855</text><text x="904.0" y="388" text-anchor="middle" class="mono" font-size="12" letter-spacing="1" fill="#7a8fb8">BARS TO SCALE</text><text x="744" y="312" class="mono" font-size="12.5" fill="#7fdcc6">← about 2% of the national list</text>
