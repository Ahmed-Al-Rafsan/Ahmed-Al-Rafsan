  <g class="mono" font-size="12.5">
    <text x="48" y="304" letter-spacing="1.6" fill="#5b8cff">EVIDENCE</text>
    <text x="48" y="326" fill="#b6c5e4">Every depth claim maps</text>
    <text x="48" y="344" fill="#b6c5e4">to a project on this page.</text>
    <text x="48" y="518" fill="#7a8fb8">No percentage bars —</text>
    <text x="48" y="536" fill="#7a8fb8">the work is the evidence.</text>
    <text x="1152" y="304" text-anchor="end" letter-spacing="1.6" fill="#5b8cff">LONG-TERM INTEREST</text>
