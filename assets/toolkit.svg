  <text x="68" y="248" class="mono" font-size="12" letter-spacing="1.2" fill="#b6c5e4">DEVELOPING NOW</text>
  <rect x="214.0" y="229" width="120.0" height="30" rx="15" fill="#5b8cff" fill-opacity=".03" stroke="#5b8cff" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="274.0" y="248.5" text-anchor="middle" class="mono" font-size="12.5" fill="#c3d2f2">dbt concepts</text><rect x="344.0" y="229" width="165.0" height="30" rx="15" fill="#5b8cff" fill-opacity=".03" stroke="#5b8cff" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="426.5" y="248.5" text-anchor="middle" class="mono" font-size="12.5" fill="#c3d2f2">ETL / ELT patterns</text><rect x="519.0" y="229" width="195.0" height="30" rx="15" fill="#5b8cff" fill-opacity=".03" stroke="#5b8cff" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="616.5" y="248.5" text-anchor="middle" class="mono" font-size="12.5" fill="#c3d2f2">Cloud data foundations</text><rect x="724.0" y="229" width="180.0" height="30" rx="15" fill="#5b8cff" fill-opacity=".03" stroke="#5b8cff" stroke-opacity=".55" stroke-dasharray="4 4"/><text x="814.0" y="248.5" text-anchor="middle" class="mono" font-size="12.5" fill="#c3d2f2">PL-300 · DP-900 prep</text>

  <!-- depth dimension line -->
  <path d="M880 284V372" stroke="#a9c4ff" stroke-opacity=".55" marker-start="url(#ta)"/>
  <path d="M880 450V536" stroke="#a9c4ff" stroke-opacity=".55" marker-end="url(#ta)"/>
  <text transform="translate(880 411) rotate(90)" text-anchor="middle" dy="4" class="mono" font-size="12.5" letter-spacing="2.4" fill="#b6c5e4">DEPTH</text>
  <rect x="376" y="284" width="448" height="58" rx="12" fill="#fff" fill-opacity=".05" stroke="#a9c4ff" stroke-opacity=".16"/><text x="396" y="309" class="sans" font-size="18" font-weight="700" fill="#f2f6ff">SQL / MySQL</text><text x="396" y="329" class="mono" font-size="12.5" fill="#b6c5e4">JOINs · CTEs · window functions · CASE WHEN</text><rect x="376" y="350" width="448" height="58" rx="12" fill="#fff" fill-opacity=".05" stroke="#a9c4ff" stroke-opacity=".16"/><text x="396" y="375" class="sans" font-size="18" font-weight="700" fill="#f2f6ff">Python</text><text x="396" y="395" class="mono" font-size="12.5" fill="#b6c5e4">pandas · NumPy · matplotlib · seaborn · Jupyter</text><rect x="376" y="416" width="448" height="58" rx="12" fill="#fff" fill-opacity=".05" stroke="#a9c4ff" stroke-opacity=".16"/><text x="396" y="441" class="sans" font-size="18" font-weight="700" fill="#f2f6ff">Power BI &amp; DAX</text><text x="396" y="461" class="mono" font-size="12.5" fill="#b6c5e4">Data modelling · DAX measures · Power Query</text><rect x="376" y="482" width="448" height="58" rx="12" fill="#fff" fill-opacity=".05" stroke="#a9c4ff" stroke-opacity=".16"/><text x="396" y="507" class="sans" font-size="18" font-weight="700" fill="#f2f6ff">Excel</text><text x="396" y="527" class="mono" font-size="12.5" fill="#b6c5e4">Pivot tables · XLOOKUP · SUMIFS · Power Query</text>

