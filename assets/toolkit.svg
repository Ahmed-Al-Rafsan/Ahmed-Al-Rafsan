<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d">
  <title id="t">Toolkit — T-shaped</title>
  <desc id="d">T-shaped skills map. Depth, used in every project: SQL and MySQL (joins, CTEs, window functions, CASE WHEN); Python (pandas, NumPy, matplotlib, seaborn, Jupyter); Power BI and DAX (data modelling, DAX measures, Power Query); Excel (pivot tables, XLOOKUP, SUMIFS, Power Query). Breadth applied in projects: applied machine learning with scikit-learn, statistics and testing, Tableau, Git and GitHub, relational data design, AI-assisted analytics. Developing now: dbt concepts, ETL and ELT patterns, cloud data foundations, PL-300 and DP-900 preparation. Long-term interest: data analysis and ML applied to aerospace.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 17;stroke-linecap:round;animation:flow 1.8s linear infinite}
    .flow.slow{animation-duration:2.6s}
    @keyframes flow{to{stroke-dashoffset:-36}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bgt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset=".6" stop-color="#0f2250"/><stop offset="1" stop-color="#173c8b"/>
    </linearGradient>
    <linearGradient id="fadet" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="maskt"><rect width="100%" height="100%" fill="url(#fadet)"/></mask>
    <clipPath id="clipt"><rect width="100%" height="100%" rx="20"/></clipPath>
    <linearGradient id="rulet" x1="0" x2="1"><stop offset="0" stop-color="#2858ef"/><stop offset=".7" stop-color="#5b8cff"/><stop offset="1" stop-color="#7fdcc6"/></linearGradient>
    <pattern id="gtm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#a9c4ff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="gtM" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#gtm)"/>
      <path d="M100 0H0V100" fill="none" stroke="#a9c4ff" stroke-opacity=".11"/>
    </pattern>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#a9c4ff" stroke-opacity=".8"/></marker>
  </defs>
  <rect width="1200" height="590" rx="20" fill="url(#bgt)"/>
  <rect width="1200" height="590" rx="20" fill="url(#gtM)" mask="url(#maskt)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#rulet)" clip-path="url(#clipt)"/>
  <rect x=".5" y=".5" width="1199" height="589" rx="19.5" fill="none" stroke="#a9c4ff" stroke-opacity=".14"/>
  <text x="48" y="60" class="mono" font-size="13.5" letter-spacing="2" fill="#5b8cff">FIG. 05  —  TOOLKIT, T-SHAPED</text>
  <text x="46" y="100" class="sans" font-size="28" font-weight="700" letter-spacing="-.6" fill="#f2f6ff">Deep where it counts. Broad enough to collaborate.</text>

  <!-- breadth dimension line -->
  <path d="M48 128H548" stroke="#a9c4ff" stroke-opacity=".55" marker-start="url(#ta)"/>
  <path d="M652 128H1152" stroke="#a9c4ff" stroke-opacity=".55" marker-end="url(#ta)"/>
  <text x="600" y="132" text-anchor="middle" class="mono" font-size="12.5" letter-spacing="2.4" fill="#b6c5e4">BREADTH</text>

