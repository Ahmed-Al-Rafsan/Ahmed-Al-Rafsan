<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Retail Sales ETL Pipeline</title>
  <desc id="d">Learning build, data engineering. Retail Sales ETL Pipeline: which sales records can the business actually trust? A Python and pandas batch pipeline in a Jupyter notebook: extract with try/except and logging, clean, remove 2 exact duplicates, cast types, then a quantity and price gate sends 53 rows to accepted and 3 rows to quarantine with a reason. Both sets are exported to CSV and JSON, read back, checked and logged. 58 = 2 + 53 + 3. Synthetic 58-row sample; AI-assisted code review and documentation.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 13;stroke-linecap:round;animation:flow 1.6s linear infinite}
    .flow.slow{animation-duration:2.4s}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
