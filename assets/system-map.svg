<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="tsm dsm">
  <title id="tsm">From clean data to AI applications: what is built and the target design</title>
  <desc id="dsm">Two lanes. The data layer is built: sources (CSV, Excel, MySQL, CRM exports), ingest with Python and pandas, validation that quarantines bad rows with a reason and reconciles row counts, scikit-learn models, and Power BI reporting. The AI application layer is a target design, not built yet: a question arrives at a FastAPI service, retrieval uses embeddings and vector search with Chroma over trusted data, a language model API returns structured output, and the answer is grounded in sources. Supporting parts, also planned: security checks, agent tools with LangGraph, and evaluation. Shipping is planned with Docker, Azure Container Apps, GitHub Actions and monitoring.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 13;stroke-linecap:round;animation:flowsm 1.7s linear infinite}
    @keyframes flowsm{to{stroke-dashoffset:-28}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulsesm 2.4s ease-out infinite}
    @keyframes pulsesm{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
