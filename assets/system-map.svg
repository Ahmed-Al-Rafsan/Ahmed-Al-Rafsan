    <pattern id="gMsm" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#gmsm)"/><path d="M100 0H0V100" fill="none" stroke="#a9c4ff" stroke-opacity=".09"/></pattern>
