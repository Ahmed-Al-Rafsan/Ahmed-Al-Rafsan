<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Al Rafsan — Data Analyst</title>
  <desc id="d">Navy blueprint-style banner. Ahmed Al Rafsan, data analyst, open to data and reporting roles. Making data make sense. A dimension line traces his path: aeronautical engineering, HR and KPI reporting, data analytics. SQL, Python, Power BI, Excel. Melbourne, Australia. A small animated figure shows raw data flowing through analysis into a ranked decision.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 17;stroke-linecap:round;animation:flow 1.8s linear infinite}
    .flow.slow{animation-duration:2.6s}
    @keyframes flow{to{stroke-dashoffset:-36}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset=".6" stop-color="#0f2250"/><stop offset="1" stop-color="#173c8b"/>
    </linearGradient>
    <linearGradient id="fadeh" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="maskh"><rect width="100%" height="100%" fill="url(#fadeh)"/></mask>
    <clipPath id="cliph"><rect width="100%" height="100%" rx="20"/></clipPath>
    <linearGradient id="ruleh" x1="0" x2="1"><stop offset="0" stop-color="#2858ef"/><stop offset=".7" stop-color="#5b8cff"/><stop offset="1" stop-color="#7fdcc6"/></linearGradient>
    <pattern id="ghm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#a9c4ff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="ghM" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#ghm)"/>
      <path d="M100 0H0V100" fill="none" stroke="#a9c4ff" stroke-opacity=".11"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#a9c4ff" stroke-opacity=".7"/>
    </marker>
    <linearGradient id="panelh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b8cff" stop-opacity=".16"/><stop offset="1" stop-color="#2858ef" stop-opacity=".04"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bgh)"/>
  <rect width="1200" height="440" rx="20" fill="url(#ghM)" mask="url(#maskh)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#ruleh)" clip-path="url(#cliph)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="19.5" fill="none" stroke="#a9c4ff" stroke-opacity=".14"/>

  <!-- status pill -->
  <g>
    <rect x="56" y="44" width="330" height="34" rx="17" fill="#2858ef" fill-opacity=".2" stroke="#5b8cff" stroke-opacity=".45"/>
    <circle cx="78" cy="61" r="5" fill="#7fdcc6" class="pulse"/>
    <circle cx="78" cy="61" r="5" fill="#7fdcc6"/>
    <text x="93" y="66" class="mono" font-size="12.5" letter-spacing="1.4" fill="#dbe6ff">OPEN TO DATA &amp; REPORTING ROLES</text>
  </g>

  <!-- identity -->
  <text x="54" y="150" class="sans" font-size="60" font-weight="700" letter-spacing="-1.6" fill="#f2f6ff">Ahmed Al Rafsan</text>
  <text x="56" y="202" class="sans" font-size="29" font-weight="600" letter-spacing="-.4" fill="#a9c4ff">Making data make sense.<tspan class="blink" fill="#7fdcc6"> _</tspan></text>
  <text x="56" y="240" class="sans" font-size="18" fill="#b6c5e4">Analytics with an engineer’s curiosity &amp; a human perspective.</text>

  <!-- the path, drawn as a dimension line -->
  <text x="56" y="286" class="mono" font-size="12" letter-spacing="1.6" fill="#7a8fb8">THE PATH  ·  THREE DISCIPLINES, ONE THREAD</text>
  <path d="M56 330H650" stroke="#a9c4ff" stroke-opacity=".6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <path d="M56.0 321V339" stroke="#a9c4ff" stroke-opacity=".6"/><path d="M254.0 321V339" stroke="#a9c4ff" stroke-opacity=".6"/><path d="M452.0 321V339" stroke="#a9c4ff" stroke-opacity=".6"/><path d="M650.0 321V339" stroke="#a9c4ff" stroke-opacity=".6"/>
  <circle cx="551.0" cy="330" r="4.5" fill="#7fdcc6"/>
  <text x="155.0" y="312" text-anchor="middle" class="mono" font-size="12" letter-spacing=".3" fill="#b6c5e4">AERONAUTICAL ENGINEERING</text><text x="155.0" y="356" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#7a8fb8">01</text><text x="353.0" y="312" text-anchor="middle" class="mono" font-size="12" letter-spacing=".3" fill="#b6c5e4">HR &amp; KPI REPORTING</text><text x="353.0" y="356" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#7a8fb8">02</text><text x="551.0" y="312" text-anchor="middle" class="mono" font-size="12" letter-spacing=".3" fill="#7fdcc6">DATA ANALYTICS</text><text x="551.0" y="356" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#7a8fb8">03 · NOW</text>

  <!-- footer meta -->
  <path d="M56 378H650" stroke="#a9c4ff" stroke-opacity=".14"/>
  <text x="56" y="404" class="mono" font-size="12.5" letter-spacing="2" fill="#a9c4ff">SQL · PYTHON · POWER BI · EXCEL</text>
  <text x="650" y="404" text-anchor="end" class="mono" font-size="12.5" letter-spacing=".8" fill="#7a8fb8">MELBOURNE · 37.81°S 144.96°E</text>

  <!-- FIG. 01 panel -->
  <g>
