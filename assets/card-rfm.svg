<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Customer Segmentation &amp; RFM</title>
  <desc id="d">Portfolio study, customer segmentation and RFM. Over 1 million transaction rows; 5,878 customers scored; 7 behavioural segments; 177 times average lifetime value between Champions and Lost customers. Champions are 25% of customers and 69.3% of revenue. 75 to 80% of new customers were lost within their first month.</desc>
  <style>
    .sans{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif}
    .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .flow{stroke-dasharray:1 17;stroke-linecap:round;animation:flow 1.8s linear infinite}
    .flow.slow{animation-duration:2.6s}
    @keyframes flow{to{stroke-dashoffset:-36}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1630"/><stop offset=".6" stop-color="#0f2250"/><stop offset="1" stop-color="#173c8b"/>
    </linearGradient>
    <linearGradient id="fader" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="maskr"><rect width="100%" height="100%" fill="url(#fader)"/></mask>
    <clipPath id="clipr"><rect width="100%" height="100%" rx="20"/></clipPath>
    <linearGradient id="ruler" x1="0" x2="1"><stop offset="0" stop-color="#2858ef"/><stop offset=".7" stop-color="#5b8cff"/><stop offset="1" stop-color="#7fdcc6"/></linearGradient>
    <pattern id="grm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#a9c4ff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="grM" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grm)"/>
      <path d="M100 0H0V100" fill="none" stroke="#a9c4ff" stroke-opacity=".11"/>
    </pattern></defs>
  <rect width="1200" height="470" rx="20" fill="url(#bgr)"/>
  <rect width="1200" height="470" rx="20" fill="url(#grM)" mask="url(#maskr)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#ruler)" clip-path="url(#clipr)"/>
  <rect x=".5" y=".5" width="1199" height="469" rx="19.5" fill="none" stroke="#a9c4ff" stroke-opacity=".14"/>
  <text x="48" y="60" class="mono" font-size="13.5" letter-spacing="2" fill="#5b8cff">02  —  PORTFOLIO STUDY · CUSTOMER ANALYTICS</text>
  <text x="46" y="112" class="sans" font-size="36" font-weight="700" letter-spacing="-.9" fill="#f2f6ff">Customer Segmentation &amp; RFM</text>
  <text x="48" y="150" class="sans" font-size="19" fill="#b6c5e4">Which customers hold the value — and where does it leak?</text>
  <text x="48" y="186" class="mono" font-size="13" letter-spacing="1.2" fill="#7fdcc6">PYTHON → MYSQL → POWER BI</text>
  <rect x="48" y="208" width="141" height="100" rx="12" fill="#fff" fill-opacity=".045" stroke="#a9c4ff" stroke-opacity=".16"/><text x="64" y="252" class="sans" font-size="31" font-weight="700" letter-spacing="-.8" fill="#f2f6ff">1M+</text><text x="64" y="276" class="sans" font-size="13" fill="#b6c5e4">transaction rows</text><text x="64" y="293" class="sans" font-size="13" fill="#b6c5e4">analysed</text><rect x="201" y="208" width="141" height="100" rx="12" fill="#fff" fill-opacity=".045" stroke="#a9c4ff" stroke-opacity=".16"/><text x="217" y="252" class="sans" font-size="31" font-weight="700" letter-spacing="-.8" fill="#f2f6ff">5,878</text><text x="217" y="276" class="sans" font-size="13" fill="#b6c5e4">customers</text><text x="217" y="293" class="sans" font-size="13" fill="#b6c5e4">scored with RFM</text><rect x="354" y="208" width="141" height="100" rx="12" fill="#fff" fill-opacity=".045" stroke="#a9c4ff" stroke-opacity=".16"/><text x="370" y="252" class="sans" font-size="31" font-weight="700" letter-spacing="-.8" fill="#f2f6ff">7</text><text x="370" y="276" class="sans" font-size="13" fill="#b6c5e4">behavioural</text><text x="370" y="293" class="sans" font-size="13" fill="#b6c5e4">segments</text><rect x="507" y="208" width="141" height="100" rx="12" fill="#fff" fill-opacity=".045" stroke="#a9c4ff" stroke-opacity=".16"/><text x="523" y="252" class="sans" font-size="31" font-weight="700" letter-spacing="-.8" fill="#f2f6ff">177×</text><text x="523" y="276" class="sans" font-size="13" fill="#b6c5e4">avg. CLV gap,</text><text x="523" y="293" class="sans" font-size="13" fill="#b6c5e4">Champions vs Lost</text>
  <rect x="48.0" y="336" width="70.6" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="83.3" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">Python</text><rect x="128.6" y="336" width="70.6" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="164.0" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">pandas</text><rect x="209.3" y="336" width="63.2" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="240.9" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">MySQL</text><rect x="282.5" y="336" width="48.3" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="306.6" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">RFM</text><rect x="340.8" y="336" width="137.6" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="409.6" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">Cohort analysis</text><rect x="488.4" y="336" width="85.5" height="28" rx="14" fill="#5b8cff" fill-opacity=".12" stroke="#5b8cff" stroke-opacity=".35"/><text x="531.2" y="354.5" text-anchor="middle" class="mono" font-size="12" fill="#d6e2ff">Power BI</text>
  <text x="48" y="438" class="mono" font-size="12" letter-spacing=".1" fill="#7a8fb8">Public UK retail dataset · recommendations are analysis, not measured results</text>

  <g>
    <rect x="672" y="36" width="484" height="398" rx="16" fill="#0a1630" fill-opacity=".55" stroke="#5b8cff" stroke-opacity=".28"/>
    <path d="M665 36H679M672 29V43" stroke="#a9c4ff" stroke-opacity=".45"/><path d="M1149 36H1163M1156 29V43" stroke="#a9c4ff" stroke-opacity=".45"/><path d="M665 434H679M672 427V441" stroke="#a9c4ff" stroke-opacity=".45"/><path d="M1149 434H1163M1156 427V441" stroke="#a9c4ff" stroke-opacity=".45"/>
    <text x="704" y="72" class="mono" font-size="12.5" letter-spacing="1.4" fill="#7a8fb8">FIG. 03 — WHERE THE VALUE SITS</text><text x="704" y="112" class="sans" font-size="14" fill="#b6c5e4">Share of customers — Champions</text><rect x="704" y="122" width="400" height="26" rx="6" fill="#a9c4ff" fill-opacity=".12"/><rect class="grow" x="704" y="122" width="100.9" height="26" rx="6" fill="#5b8cff"/><text x="794.9" y="140" text-anchor="end" class="sans" font-size="14" font-weight="700" fill="#fff">25%</text><text x="704" y="180" class="sans" font-size="14" fill="#b6c5e4">Share of revenue — Champions</text><rect x="704" y="190" width="400" height="26" rx="6" fill="#a9c4ff" fill-opacity=".12"/><rect class="grow" x="704" y="190" width="277.2" height="26" rx="6" fill="#5b8cff"/><text x="971.2" y="208" text-anchor="end" class="sans" font-size="14" font-weight="700" fill="#fff">69.3%</text><text x="704" y="244" class="mono" font-size="12.5" fill="#7fdcc6">1,482 Champions → 69.3% of total revenue</text><path d="M704 268H1104" stroke="#a9c4ff" stroke-opacity=".14"/><text x="704" y="300" class="sans" font-size="14" fill="#b6c5e4">New customers lost within month one</text><text x="1104" y="300" text-anchor="end" class="sans" font-size="17" font-weight="700" fill="#ff9d8a">75–80%</text><rect x="704" y="314" width="400" height="10" rx="5" fill="#a9c4ff" fill-opacity=".12"/><rect x="1004.0" y="310" width="20.0" height="18" rx="4" fill="#ff9d8a"/><path d="M704 338V346M1104 338V346M704 342H1104" stroke="#a9c4ff" stroke-opacity=".4"/><text x="704" y="364" class="mono" font-size="12" fill="#7a8fb8">0%</text><text x="1104" y="364" text-anchor="end" class="mono" font-size="12" fill="#7a8fb8">100%</text>
  </g>
</svg>
